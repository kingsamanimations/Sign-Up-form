<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up form</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script>
</head>
<body>
    <main>
        <div class="left">
            <h1>Hi</h1>
            <div class="img-desc">
                <p style="color: aliceblue;">Photo by <a style="color: greenyellow;" href="https://unsplash.com/photos/a-blurry-photo-of-a-city-street-at-night-B40aLA7EBOE">Jack Sparrow</a> on <a style="color: greenyellow;" href="https://unsplash.com/photos">Unsplash</a></p>
            </div>
        </div>
        <div class="right">
            <div class="first">
                <h3>
                    This is not a real online service! You know you need something <br/>
                    like this in your life to help you realize your deepest dreams.<br/>
                    Sign up <em>now</em> to get started.
                    <br/><br/>
                    You <em>know</em> you want to.
                </h3>
            </div>
            <div class="second">
                <h3 style="margin-left: 10px; text-transform: capitalize;">Let's do this!</h3>
                <form action="#" method="get" class="form-main-div">
                    <div class="form-divs">
                        <div class="form-div">
                            <label for="first_name">FIRST NAME</label>
                            <input type="text" id="first_name" name="user_name" required>
                        </div>

                        <div class="form-div">
                            <label for="user_email">EMAIL</label>
                            <input type="email" id="user_email" name="user_email" required>
                        </div>

                        <div class="form-div">
                            <label for="user_password">PASSWORD</label>
                            <input type="password" id="user_password" name="user_password" required>
                        </div>
                    </div>

                    <div class="form-divs">
                        <div class="form-div">
                            <label for="first_name">LAST NAME</label>
                            <input type="text" id="last_name" name="user_name" required>
                        </div>

                        <div class="form-div">
                            <label for="user_email">PHONE NUMBER</label>
                            <input type="email" id="user_email" name="user_email" required>
                        </div>

                        <div class="form-div">
                            <label for="user_password">CONFIRM PASSWORD</label>
                            <input type="password" id="user_password" name="user_password" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="third">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="http://example.com">Log in</a></p>
            </div>
        </div>
    </main>
</body>
</html>
